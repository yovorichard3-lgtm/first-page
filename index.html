    <body> 

       <div class="bg-image"></div>
    <header>
      <div class="table">
        <h1><strong>THE NAILS BY DINA</strong></h1>
         <a href="index.html"></a>
      </div>
    <form action="yovorichard3@gmail.com" method="post">
        <h2>Formulaire de prise du rdv</h2>
    <div>
      <label for="name">Pseudo&nbsp;:<strong><span aria-label="required">*</span></strong></label>
      <input type="text" id="name" name="user_name"  placeholder="votre nom ou prenom..."/>
     
    </div>
   <div>
      <label for="mail">E-mail&nbsp;:<strong><span aria-label="required">*</span></strong></label>
      <input type="email" id="mail" name="user_email"/>
     
  </div>
    <div>
      <label for="msg">Message&nbsp;:<strong><span aria-label="required">*</span></strong></label>
      <textarea id="msg" name="user_message"placeholder="saisissez vos besoins ici......"></textarea>
    </div>
    <div>
       <label for="datetime">Date&Heure&nbsp;:<strong><span aria-label="required">*</span></strong></label>
        <input type="datetime-local" name="datetime" id="datetime" /> 
    </div>


        <section>
  <h2>Informations de paiement</h2>
  <p>
    <label for="card">
      <span>Type de carte&nbsp;:</span>
    </label>
    <select id="card" name="usercard">
      <option value="visa">Visa</option>
      <option value="mc">Mastercard</option>
    </select>
  </p>
  <p>
    <label for="number">
      <span>Numéro de carte&nbsp;:</span>
      <strong><span aria-label="required">*</span></strong>
    </label>
    <input type="tel" id="number" name="cardnumber" required />
  </p>
  <p>
    <label for="expiration">
      <span>Date d'expiration&nbsp;:</span>
      <strong><span aria-label="required">*</span></strong>
    </label>
    <input
      type="text"
      id="expiration"
      required="true"
      placeholder="MM/YY"
      pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$" />
  </p>
</section>


  <section>
     <div class="button">
    <button type="submit">Envoyer votre rdv</button>
  </div>
    <p>
    <button type="submit">Valider le paiement</button>
  </p>
  </section>
</form>
